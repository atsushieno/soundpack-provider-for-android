name: build

on:
  push:
  pull_request:
  workflow_call:

jobs:
  linux-build:
    name: build on linux
    runs-on: ubuntu-24.04
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: temurin
    - name: cache gradle caches
      uses: actions/cache@v4
      env:
        cache-name: cache-gradle-caches
      with:
        path: /home/runner/.gradle/caches/
        key: ${{ runner.os }}-gradle-caches
    - name: build
      run: ./gradlew build publishToMavenLocal
    # The device tests read sample packs, drive the system folder picker and talk to the
    # Soundpack Manager, so they run on real devices (README, "Build and test"), not here.
    - name: upload artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: soundpack-apps-and-libs
        path: |
          ./*/build/outputs/aar/*-release.aar
          app/build/outputs/apk/debug/*.apk
          samples/*/build/outputs/apk/debug/*.apk

  osx-build:
    name: build on osx
    runs-on: macos-14
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: temurin
    - name: cache gradle caches
      uses: actions/cache@v4
      env:
        cache-name: cache-gradle-caches
      with:
        path: /Users/runner/.gradle/caches/
        key: ${{ runner.os }}-gradle-caches
    - name: build
      run: ./gradlew build publishToMavenLocal
      env:
        ANDROID_SDK_ROOT: /Users/runner/Library/Android/sdk
