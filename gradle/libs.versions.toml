[versions]

# Aligned with the AAP repositories (aap-lv2-sfizz, aap-core).
android-compileSdk = "37"
android-minSdk = "29"
android-targetSdk = "37"

agp = "9.3.2"
kotlin = "2.2.20"
coroutines = "1.11.0"
core-ktx = "1.19.0"
activity-compose = "1.13.0"
junit = "4.13.2"
test-ext-junit = "1.3.0"
rules = "1.7.0"
test-runner = "1.7.0"
vanniktech-maven-publish = "0.37.0"

[libraries]

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-ext-junit" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "rules" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }

[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-maven-publish" }
